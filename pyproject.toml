[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restlos-uninstaller"
version = "1.9.0"
description = "Safe Linux app and game uninstaller with residual cleanup and recovery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jurkast" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/jurkast/restlos"
Repository = "https://github.com/jurkast/restlos"
Issues = "https://github.com/jurkast/restlos/issues"

[project.scripts]
restlos = "restlos.cli:main"

[tool.setuptools]
packages = ["restlos"]
